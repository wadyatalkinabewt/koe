# User profile
profile:
  user_name:
    value: null
    type: str
    description: "Your name - used to label your microphone audio in Scribe transcripts."

# Meeting output
meeting_options:
  root_folder:
    value: null
    type: str
    description: "Root folder for meeting recordings. Defaults to <koe-repo>/Meetings."

# Transcription (Groq cloud)
model_options:
  common:
    language:
      value: en
      type: str
      description: "ISO-639-1 language code passed to Groq Whisper. null = auto-detect."
    initial_prompt:
      value: null
      type: str
      description: "Vocab/style hint passed to Whisper. Comma-separated proper nouns work best."

# Activation + recording
recording_options:
  activation_key:
    value: ctrl+shift+space
    type: str
    description: "Hotkey to start/stop snippet recording. Separate keys with '+'."
  input_backend:
    value: auto
    type: str
    description: "Keyboard listener backend."
    options:
      - auto
      - evdev
      - pynput
  recording_mode:
    value: press_to_toggle
    type: str
    description: "Recording trigger style."
    options:
      - continuous
      - voice_activity_detection
      - press_to_toggle
      - hold_to_record
  sound_device:
    value: null
    type: str
    description: "Sound device index (run `python -m sounddevice` to list). null = default."
  sample_rate:
    value: 16000
    type: int
    description: "Recording sample rate in Hz."
  silence_duration:
    value: 900
    type: int
    description: "Milliseconds of silence before VAD modes auto-stop the recording."
  min_duration:
    value: 100
    type: int
    description: "Minimum recording length in ms — shorter recordings are discarded."

# Post-processing
post_processing:
  remove_fillers:
    value: true
    type: bool
    description: "Strip 'um/uh/ah' style disfluencies from snippet transcriptions."
  add_trailing_space:
    value: true
    type: bool
    description: "Append a trailing space to snippets so they paste cleanly."
  ai_cleanup_enabled:
    value: true
    type: bool
    description: "Use OpenRouter to clean up snippet grammar/punctuation. Requires OPENROUTER_API_KEY."
  ai_cleanup_threshold:
    value: 10
    type: int
    description: "Minimum snippet duration (seconds) before cleanup is applied. 0 = always."
  ai_cleanup_model:
    value: google/gemini-3-flash-preview
    type: str
    description: "OpenRouter model slug for cleanup. See benchmarks/cleanup_bench.py for the model selection rationale."
  ai_cleanup_prompt:
    value: ""
    type: str
    description: "Prompt prefix sent to the cleanup model. Transcription is appended at the end."

# Misc
misc:
  print_to_terminal:
    value: true
    type: bool
    description: "Print status + transcript to the terminal."
  hide_status_window:
    value: false
    type: bool
    description: "Hide the snippet status popup window."
  noise_on_completion:
    value: true
    type: bool
    description: "Play a beep when snippet transcription completes."
  snippets_folder:
    value: null
    type: str
    description: "Where to save rolling snippet markdown files. null = <koe-repo>/Snippets."
