# User profile
profile:
  user_name:
    value: null
    type: str
    description: "Your name, used to label microphone audio in Scribe transcripts."

# Meeting output
meeting_options:
  root_folder:
    value: null
    type: str
    description: "Root folder for Scribe output. null = the current default meetings folder."
  save_audio:
    value: false
    type: bool
    description: "Keep microphone.wav and meeting-audio.wav with completed Scribe output."
  save_markdown:
    value: false
    type: bool
    description: "Also keep transcript.md and summary.md alongside the always-saved PDFs."
  last_meeting_mode:
    value: online_one_on_one
    type: str
    options:
      - online_one_on_one
      - online_group
      - in_person_one_on_one
      - in_person_group
    description: "Last Scribe meeting type selected in the meeting window."

# ElevenLabs transcription
model_options:
  common:
    language:
      value: null
      type: str
      description: "Optional ISO language code. null = automatic detection."

# Deterministic local post-transcription corrections. This mapping remains
# private in config.yaml and is never sent to a provider.
transcription_options:
  corrections:
    value: {}
    type: dict
    description: "Exact words or phrases mapped to their preferred spelling."

# Activation and recording
recording_options:
  activation_key:
    value: ctrl+shift+space
    type: str
    description: "Hotkey to start or stop snippet recording."

# App behavior
misc:
  print_to_terminal:
    value: false
    type: bool
    description: "Print status and transcript text when a console is attached."
  noise_on_completion:
    value: true
    type: bool
    description: "Play a sound when snippet transcription completes."
  snippets_folder:
    value: null
    type: str
    description: "Snippet output folder. null = the current default snippets folder."
