# User profile
profile:
  user_name:
    value: null
    type: str
    description: "Your name, used to label microphone audio in Scribe transcripts."

# Meeting output
meeting_options:
  root_folder:
    value: null
    type: str
    description: "Root folder for Scribe output. null = <koe-repo>/Meetings."
  save_audio:
    value: false
    type: bool
    description: "Keep microphone.wav and meeting-audio.wav with completed Scribe output."

# ElevenLabs transcription
model_options:
  common:
    language:
      value: null
      type: str
      description: "Optional ISO language code. null = automatic detection."
    initial_prompt:
      value: null
      type: str
      description: "Comma-separated vocabulary sent to ElevenLabs as keyterms."
  elevenlabs:
    keyterms_enabled:
      value: true
      type: bool
      description: "Send the configured vocabulary as ElevenLabs keyterms."

# Activation and recording
recording_options:
  activation_key:
    value: ctrl+shift+space
    type: str
    description: "Hotkey to start or stop snippet recording."

# App behavior
misc:
  print_to_terminal:
    value: true
    type: bool
    description: "Print status and transcript text when a console is attached."
  hide_status_window:
    value: false
    type: bool
    description: "Hide the snippet status card."
  noise_on_completion:
    value: true
    type: bool
    description: "Play a sound when snippet transcription completes."
  snippets_folder:
    value: null
    type: str
    description: "Snippet output folder. null = <koe-repo>/Snippets."
